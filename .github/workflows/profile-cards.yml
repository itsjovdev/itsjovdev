name: Profile Summary Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Usa un token personal (PROFILE_TOKEN, con permiso "repo") para que cuente
          # todos tus PRs, issues y repos privados. Si no existe, cae al token por
          # defecto, que solo ve datos públicos de este repo y da cifras más bajas.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Europe/Madrid"
          THEME: "tokyonight"
